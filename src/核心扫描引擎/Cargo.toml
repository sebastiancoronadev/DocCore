[package]
name = "binary_scanner"
version = "3.0.0"
edition = "2021"
authors = ["DocCore Security Team"]
description = "核心二进制扫描引擎 - High Performance Parallel Malware Detection"

[dependencies]
sha2 = "0.10"
md-5 = "0.10"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"